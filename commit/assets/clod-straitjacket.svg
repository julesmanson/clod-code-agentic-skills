<svg viewBox="0 0 420 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A blocky orange-headed cartoon character wrapped in a white straitjacket, with the tagline: git it now before they commit you">
  <!-- head -->
  <rect x="140" y="26" width="140" height="110" rx="20" fill="#e8792e" stroke="#1b1b1b" stroke-width="4"/>

  <!-- dizzy X eyes -->
  <g stroke="#1b1b1b" stroke-width="5" stroke-linecap="round">
    <line x1="172" y1="64" x2="188" y2="80"/>
    <line x1="188" y1="64" x2="172" y2="80"/>
    <line x1="232" y1="64" x2="248" y2="80"/>
    <line x1="248" y1="64" x2="232" y2="80"/>
  </g>

  <!-- nervous wavy mouth -->
  <path d="M178 108 Q195 120 210 108 T242 108" fill="none" stroke="#1b1b1b" stroke-width="4" stroke-linecap="round"/>

  <!-- sweat drop -->
  <path d="M282 44 C285.5 49 287.25 53 287.25 56 A5.25 5.25 0 0 1 276.75 56 C276.75 53 278.5 49 282 44 Z" fill="#bfeaf2" stroke="#1b1b1b" stroke-width="2"/>

  <!-- torso -->
  <rect x="105" y="140" width="210" height="150" rx="28" fill="#ffffff" stroke="#1b1b1b" stroke-width="4"/>

  <!-- crossed straitjacket arms -->
  <rect x="120" y="150" width="46" height="180" rx="20" transform="rotate(35 143 240)" fill="#f2f2f2" stroke="#1b1b1b" stroke-width="3"/>
  <rect x="255" y="150" width="46" height="180" rx="20" transform="rotate(-35 278 240)" fill="#f2f2f2" stroke="#1b1b1b" stroke-width="3"/>

  <!-- center buckle (metal, not leather, so it still reads against white) -->
  <circle cx="210" cy="215" r="16" fill="#9a9a9a" stroke="#1b1b1b" stroke-width="3"/>
  <rect x="204" y="209" width="12" height="12" fill="#d4d4d4"/>

  <!-- restraining belt -->
  <rect x="105" y="248" width="210" height="16" fill="#6b4a2b" stroke="#1b1b1b" stroke-width="2"/>
  <circle cx="210" cy="256" r="10" fill="#9a9a9a" stroke="#1b1b1b" stroke-width="2"/>

  <!-- feet -->
  <rect x="140" y="288" width="40" height="22" rx="10" fill="#2f8f8f" stroke="#1b1b1b" stroke-width="3"/>
  <rect x="240" y="288" width="40" height="22" rx="10" fill="#2f8f8f" stroke="#1b1b1b" stroke-width="3"/>

  <!-- tagline, comic-outlined so it reads on light or dark backgrounds -->
  <text x="210" y="330" text-anchor="middle" font-family="monospace" font-weight="bold"
        font-size="20" fill="#1b1b1b" stroke="#ffffff" stroke-width="3" paint-order="stroke fill">
    git it now before they commit you
  </text>
</svg>
