<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="coneLight" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#eaf6ff" stop-opacity="1"/>
      <stop offset="45%" stop-color="#bfe3ff" stop-opacity="0.75"/>
      <stop offset="80%" stop-color="#8fcdfb" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8fcdfb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#030417" stop-opacity="0"/>
      <stop offset="100%" stop-color="#030417" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- room: very dark blue, nothing past the cone reads as more than silhouette -->
  <rect x="0" y="0" width="800" height="600" fill="#05071c"/>

  <!-- the cone of light, hanging from a cord off-top -->
  <line x1="400" y1="0" x2="400" y2="70" stroke="#222222" stroke-width="3"/>
  <ellipse cx="400" cy="68" rx="18" ry="8" fill="#2a2a2a"/>
  <polygon points="400,76 80,480 720,480" fill="url(#coneLight)"/>

  <!-- the table, inside the lit circle -->
  <rect x="270" y="400" width="260" height="22" rx="4" fill="#6b6f73"/>
  <rect x="285" y="422" width="18" height="90" fill="#45484b"/>
  <rect x="497" y="422" width="18" height="90" fill="#45484b"/>

  <!-- CLOD, matched to the repo's canonical clod.svg design, standing on top of the table -->
  <g transform="translate(343,317) scale(0.55)">
    <rect x="34" y="15" width="140" height="110" rx="20" fill="#e8792e" stroke="#1b1b1b" stroke-width="4"/>
    <rect x="4" y="79" width="30" height="30" rx="8" fill="#e8792e" stroke="#1b1b1b" stroke-width="3"/>
    <rect x="174" y="79" width="30" height="30" rx="8" fill="#e8792e" stroke="#1b1b1b" stroke-width="3"/>
    <rect x="66" y="53" width="16" height="16" fill="#1b1b1b"/>
    <rect x="126" y="53" width="16" height="16" fill="#1b1b1b"/>
    <rect x="34" y="129" width="40" height="22" rx="10" fill="#3776ab" stroke="#1b1b1b" stroke-width="3"/>
    <rect x="134" y="129" width="40" height="22" rx="10" fill="#3776ab" stroke="#1b1b1b" stroke-width="3"/>
  </g>

  <!-- vignette so the room edges fall off into true black -->
  <rect x="0" y="0" width="800" height="600" fill="url(#shade)"/>
</svg>
