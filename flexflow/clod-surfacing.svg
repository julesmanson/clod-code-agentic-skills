<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Clod, the blocky orange-headed cartoon character, riding a surfboard on calm water with a tall scythe-shaped wave curling down to the water off to the right">
  <!-- tall scythe-shaped wave, a bold stroked curve (not a filled blob) matching the reference sketch's own line-art shape, positioned clear of Clod and the board -->
  <path d="M255,10 Q335,68 305,175" fill="none" stroke="#3776ab" stroke-width="9" stroke-linecap="round"/>

  <!-- waterline: a thin baseline near the bottom of the canvas, spanning full width, with just a shallow fill below it -->
  <path d="M0,176 Q40,170 80,176 T160,173 T240,177 T320,172 L320,200 L0,200 Z" fill="#3776ab" stroke="#1b1b1b" stroke-width="3"/>

  <!-- surfboard, independent of Clod's own scale, lowered to sit right at the water's surface -->
  <path d="M95,165 Q140,156 185,165 Q140,174 95,165 Z" fill="#f2e9d8" stroke="#1b1b1b" stroke-width="3"/>
  <line x1="103" y1="165" x2="177" y2="165" stroke="#e8792e" stroke-width="2"/>

  <!-- Clod, same scale(0.1875) as always — size untouched — standing centered on the board -->
  <g transform="translate(121,133) scale(0.1875)">
    <!-- arms, out to the sides for balance -->
    <rect x="4" y="79" width="30" height="30" rx="8" fill="#e8792e" stroke="#1b1b1b" stroke-width="3"/>
    <rect x="174" y="79" width="30" height="30" rx="8" fill="#e8792e" stroke="#1b1b1b" stroke-width="3"/>

    <!-- head -->
    <rect x="34" y="15" width="140" height="110" rx="20" fill="#e8792e" stroke="#1b1b1b" stroke-width="4"/>

    <!-- black square eyes -->
    <rect x="66" y="53" width="16" height="16" fill="#1b1b1b"/>
    <rect x="126" y="53" width="16" height="16" fill="#1b1b1b"/>

    <!-- feet -->
    <rect x="34" y="129" width="40" height="22" rx="10" fill="#3776ab" stroke="#1b1b1b" stroke-width="3"/>
    <rect x="134" y="129" width="40" height="22" rx="10" fill="#3776ab" stroke="#1b1b1b" stroke-width="3"/>
  </g>
</svg>
